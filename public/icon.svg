<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e3a8a"/>
      <stop offset="50%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#4ade80"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background rounded squircle -->
  <rect width="512" height="512" rx="128" fill="url(#bg)"/>

  <!-- Scanning grid subtle -->
  <circle cx="256" cy="240" r="160" fill="none" stroke="#60a5fa" stroke-width="2" stroke-opacity="0.3" stroke-dasharray="8 8"/>
  <circle cx="256" cy="240" r="120" fill="none" stroke="#93c5fd" stroke-width="2" stroke-opacity="0.4"/>

  <!-- Scanning corners reticle -->
  <path d="M 140 180 L 140 140 L 180 140" fill="none" stroke="#38bdf8" stroke-width="12" stroke-linecap="round"/>
  <path d="M 372 180 L 372 140 L 332 140" fill="none" stroke="#38bdf8" stroke-width="12" stroke-linecap="round"/>
  <path d="M 140 300 L 140 340 L 180 340" fill="none" stroke="#38bdf8" stroke-width="12" stroke-linecap="round"/>
  <path d="M 372 300 L 372 340 L 332 340" fill="none" stroke="#38bdf8" stroke-width="12" stroke-linecap="round"/>

  <!-- Teacher Face Avatar Silhouette -->
  <!-- Head -->
  <circle cx="256" cy="200" r="54" fill="#ffffff" filter="url(#glow)"/>
  
  <!-- Teacher Graduation / Academic Cap symbol or hair -->
  <polygon points="256,128 320,152 256,176 192,152" fill="#fbbf24"/>
  <polygon points="256,176 220,162 220,172 256,186 292,172 292,162" fill="#d97706"/>
  <circle cx="320" cy="170" r="6" fill="#f59e0b"/>
  <line x1="320" y1="152" x2="320" y2="170" stroke="#f59e0b" stroke-width="3"/>

  <!-- Body / Shoulders -->
  <path d="M 180 305 C 180 260 214 250 256 250 C 298 250 332 260 332 305 C 332 320 320 326 256 326 C 192 326 180 320 180 305 Z" fill="#e0f2fe"/>
  <!-- Tie / Collar -->
  <polygon points="256,260 266,275 256,310 246,275" fill="#3b82f6"/>

  <!-- Biometric Scan Laser Line -->
  <line x1="140" y1="230" x2="372" y2="230" stroke="#4ade80" stroke-width="6" stroke-linecap="round" filter="url(#glow)"/>

  <!-- Checkmark Badge on bottom right -->
  <circle cx="360" cy="370" r="48" fill="#10b981" stroke="#ffffff" stroke-width="6"/>
  <path d="M 342 370 L 354 382 L 378 358" fill="none" stroke="#ffffff" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
